name: Feature request
description: Propose a new capability or a change in behaviour.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Argus is spec first: an accepted change starts as a spec in docs/specs/.
        It is also single-node first, so a proposal that needs a new required
        external service (Postgres, Redis, a broker, ...) needs a strong case.
        Please write in English.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you would like. Mention the surfaces it touches (dashboard, REST API, MCP tools, engines).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: spec
    attributes:
      label: Related spec
      description: The docs/specs/*.spec.md this would change, if you know it.
      placeholder: docs/specs/account-selection.spec.md

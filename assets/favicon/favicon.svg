<svg xmlns="http://www.w3.org/2000/svg" width="130" height="190" viewBox="5 -25 130 190"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
    <!-- Gradient for the outer eye shell -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"></stop> <!-- Sky Blue -->
      <stop offset="100%" stop-color="#818CF8"></stop> <!-- Indigo -->
    </linearGradient>

    <!-- Gradient for the central orchestrator core -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"></stop> <!-- Blue -->
      <stop offset="100%" stop-color="#A855F7"></stop> <!-- Purple -->
    </linearGradient>

    <!-- Core glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs><path d="M 10 70 Q 70 -20 130 70 Q 70 160 10 70 Z" fill="#1E293B" fill-opacity="0.55" stroke="url(#eyeGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="70" cy="70" r="45" fill="none" stroke="#94A3B8" stroke-width="1.75" stroke-dasharray="6 6"></circle><path d="M 38 38 L 70 70 L 102 38 M 38 102 L 70 70 L 102 102 M 10 70 L 130 70 M 70 10 L 70 130" fill="none" stroke="#94A3B8" stroke-width="1.75" opacity="0.85"></path><circle cx="38" cy="38" r="5" fill="#38BDF8"></circle><circle cx="102" cy="38" r="5" fill="#38BDF8"></circle><circle cx="38" cy="102" r="5" fill="#818CF8"></circle><circle cx="102" cy="102" r="5" fill="#818CF8"></circle><circle cx="70" cy="25" r="3.5" fill="#A855F7"></circle><circle cx="70" cy="115" r="3.5" fill="#A855F7"></circle><circle cx="25" cy="70" r="3.5" fill="#38BDF8"></circle><circle cx="115" cy="70" r="3.5" fill="#38BDF8"></circle><circle cx="70" cy="70" r="23" fill="url(#coreGrad)" filter="url(#glow)"></circle><circle cx="70" cy="70" r="16" fill="#020617"></circle><path d="M 66 63 L 59 70 L 66 77 M 74 63 L 81 70 L 74 77" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
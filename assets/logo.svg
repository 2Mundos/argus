<svg xmlns="http://www.w3.org/2000/svg" width="160" height="104" viewBox="0 0 160 104" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Argus symbol</title>
  <desc id="desc">Three-dimensional geometric eye with a spherical iris, code core and four connected nodes, in a cyan, blue and violet gradient on a transparent background.</desc>
  <defs>
    <!-- Brand colour sweep -->
    <linearGradient id="brand" x1="8" y1="22" x2="152" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#4F8DFF"/>
      <stop offset="1" stop-color="#A66BFF"/>
    </linearGradient>
    <!-- Bevel: light from above, shade below -->
    <linearGradient id="lidBevel" x1="80" y1="14" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".62" stop-color="#1A1F6B" stop-opacity="0"/>
      <stop offset="1" stop-color="#1A1F6B" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="ring" x1="56" y1="30" x2="104" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2BDCF2"/>
      <stop offset=".55" stop-color="#5179F8"/>
      <stop offset="1" stop-color="#A866FF"/>
    </linearGradient>
    <linearGradient id="ringBevel" x1="80" y1="26" x2="80" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".6"/>
      <stop offset=".38" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".6" stop-color="#17195E" stop-opacity="0"/>
      <stop offset="1" stop-color="#17195E" stop-opacity=".42"/>
    </linearGradient>
    <!-- Iris orb: lit from the upper left -->
    <radialGradient id="orb" cx="74" cy="45" r="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AF4FF"/>
      <stop offset=".4" stop-color="#4F9BFF"/>
      <stop offset="1" stop-color="#6A45E8"/>
    </radialGradient>
    <linearGradient id="gloss" x1="76" y1="37" x2="76" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cast" cx="80" cy="57" r="31" gradientUnits="userSpaceOnUse">
      <stop offset=".7" stop-color="#2A2F8F" stop-opacity="0"/>
      <stop offset=".84" stop-color="#2A2F8F" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2A2F8F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeA" cx=".35" cy=".3" r=".8">
      <stop stop-color="#C9FBFF"/>
      <stop offset=".45" stop-color="#2DC5ED"/>
      <stop offset="1" stop-color="#2F6FE0"/>
    </radialGradient>
    <radialGradient id="nodeB" cx=".35" cy=".3" r=".8">
      <stop stop-color="#E4D9FF"/>
      <stop offset=".45" stop-color="#8F7DFC"/>
      <stop offset="1" stop-color="#6A3FD9"/>
    </radialGradient>
  </defs>

  <!-- Lid ribbon: tapered at the corners, fullest at the centre; interior is transparent -->
  <path id="lid" fill-rule="evenodd" clip-rule="evenodd" fill="url(#brand)"
        d="M8 52C30 27 53 14 80 14s50 13 72 38c-22 25-45 38-72 38S30 77 8 52Zm7 0c18 19 41 31 65 31s47-12 65-31c-18-19-41-31-65-31S33 33 15 52Z"/>
  <path fill-rule="evenodd" clip-rule="evenodd" fill="url(#lidBevel)"
        d="M8 52C30 27 53 14 80 14s50 13 72 38c-22 25-45 38-72 38S30 77 8 52Zm7 0c18 19 41 31 65 31s47-12 65-31c-18-19-41-31-65-31S33 33 15 52Z"/>
  <path d="M15.5 48C34 28.5 55 16.6 80 16.6S126 28.500 144.500 48" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1" stroke-linecap="round"/>

  <!-- Connections -->
  <path d="M38 43 54.6 46.6M122 43 105.4 46.6M38 61 54.6 57.4M122 61 105.4 57.4" stroke="url(#brand)" stroke-opacity=".75" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M21 52h30m58 0h30" stroke="url(#brand)" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Agent nodes: small spheres -->
  <circle cx="38" cy="43" r="4.5" fill="url(#nodeA)"/>
  <circle cx="38" cy="61" r="4.5" fill="url(#nodeA)"/>
  <circle cx="122" cy="43" r="4.5" fill="url(#nodeB)"/>
  <circle cx="122" cy="61" r="4.5" fill="url(#nodeB)"/>
  <g fill="#FFFFFF" fill-opacity=".85">
    <circle cx="36.600" cy="41.500" r="1.100"/><circle cx="36.600" cy="59.500" r="1.100"/>
    <circle cx="120.600" cy="41.500" r="1.100"/><circle cx="120.600" cy="59.500" r="1.100"/>
  </g>

  <!-- Iris: soft cast shadow, bevelled ring, floating glass orb -->
  <circle cx="80" cy="57" r="31" fill="url(#cast)"/>
  <circle cx="80" cy="52" r="22.500" stroke="url(#ring)" stroke-width="7"/>
  <circle cx="80" cy="52" r="22.500" stroke="url(#ringBevel)" stroke-width="7"/>
  <circle cx="80" cy="52" r="16" fill="url(#orb)"/>
  <ellipse cx="76" cy="44" rx="10" ry="6.500" transform="rotate(-18 76 44)" fill="url(#gloss)"/>

  <!-- Code core -->
  <path d="m75.500 47-5.500 6 5.500 6m9-12 5.500 6-5.500 6" stroke="#1B1A6B" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m75.500 46-5.500 6 5.500 6m9-12 5.500 6-5.500 6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="80" cy="52" r="1.700" fill="#FFFFFF"/>
</svg>

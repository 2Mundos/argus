# Local infrastructure only. Apps run on the host (`make dev-api`, `make dev-dashboard`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:

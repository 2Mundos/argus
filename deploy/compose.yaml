# One-process Argus (docs/specs/single-node.spec.md). From the repo root:
#   docker compose -f deploy/compose.yaml up --build
# Dashboard: http://127.0.0.1:8000  ·  admin token: docker compose -f deploy/compose.yaml exec argus cat /data/admin-token
#
# Optional local fleet (Docker pools / NanoClaw host): also pass
#   -f deploy/compose.docker.yaml
# and set DOCKER_GID and DOCKER_BRIDGE_IP as shown in that overlay.
services:
  argus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: argus:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - argus-data:/data
    environment:
      # Reachable from containers Argus starts on the host Docker (compose.docker.yaml).
      ARGUS_PUBLIC_URL: ${ARGUS_PUBLIC_URL:-http://host.docker.internal:8000}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  argus-data:

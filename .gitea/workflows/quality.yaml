name: Quality
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | sh; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - run: uv sync --all-packages --group dev --frozen
      - name: Install sops and age (secret store tests)
        run: |
          curl -sSfL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /usr/local/bin/sops" | sha256sum -c -
          chmod +x /usr/local/bin/sops
          curl -sSfL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/age.tgz" | sha256sum -c -
          tar -xzf /tmp/age.tgz -C /tmp && install -m 755 /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -n auto
      - name: OpenAPI contract drift
        run: uv run python scripts/export_openapi.py --check

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Client types match the committed contract
        run: make openapi-client-check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Smoke that Dockerfile.api still builds. On PRs, skip when no image inputs
  # changed (job still runs so a required "image" check gets a green status).
  # Buildx + actions/cache keeps layer reuse across runs on Gitea runners.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether image inputs changed
        id: need
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          # Paths copied by deploy/Dockerfile.api (or that change its context).
          pattern='^(deploy/|\.dockerignore$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|tsconfig\.base\.json$|packages/api-client/|apps/dashboard/|pyproject\.toml$|uv\.lock$|apps/api/|packages/core/|integrations/nanoclaw/engines/model-policy\.defaults\.json$)'
          if git diff --name-only "$BASE" HEAD | grep -E "$pattern" >/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping image build: no Dockerfile inputs changed"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.need.outputs.build == 'true'
      - uses: actions/cache@v4
        if: steps.need.outputs.build == 'true'
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('deploy/Dockerfile.api', 'uv.lock', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Ensure buildx cache dir
        if: steps.need.outputs.build == 'true'
        run: mkdir -p /tmp/.buildx-cache
      - name: Build image
        if: steps.need.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          tags: argus:ci
          # Validate the build only; no need to load into the local daemon.
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
      - name: Rotate buildx cache
        if: steps.need.outputs.build == 'true'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # The NanoClaw tools layer builds from this checkout alone (apply-tools-layer.sh's
  # staged context) and argus-delegate loads every module it imports. The base is
  # node:22-slim plus git, the part of NanoClaw's image the layer relies on; the
  # full agent image (6 GB, pinned CLIs) stays a host build (provision.sh). The
  # engines Dockerfile patch is covered by pytest on real Dockerfile states. On
  # PRs, skips when integrations/nanoclaw/ did not change.
  tools-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether tools-layer inputs changed
        id: need
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -E '^(integrations/nanoclaw/|\.gitea/workflows/quality\.yaml$)' >/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping tools-layer build: integrations/nanoclaw/ unchanged"
          fi
      - name: Build the tools layer on a minimal base
        if: steps.need.outputs.build == 'true'
        run: |
          set -euo pipefail
          printf 'FROM node:22-slim\nRUN apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*\n' \
            | docker build -t argus-tools-layer-ci-base -
          integrations/nanoclaw/engines/apply-tools-layer.sh argus-tools-layer-ci-base argus-tools-layer:ci
      - name: Smoke the layer
        if: steps.need.outputs.build == 'true'
        run: |
          set -euo pipefail
          # 64 is argus-delegate's usage exit (no EXECUTOR): it got past every import;
          # a missing module exits 1 before that.
          docker run --rm argus-tools-layer:ci sh -c '
            argus-delegate >/dev/null 2>&1; rc=$?; [ "$rc" = 64 ] || { echo "argus-delegate exited $rc"; exit 1; }
            for m in account-settings model-policy milestones livelog usage anthropic-redirect; do
              node -e "import(\"/usr/local/bin/$m.mjs\")" || exit 1
            done
            for b in ssh rsync git python3 uv make argus-gitea-api; do command -v "$b" >/dev/null || { echo "missing $b"; exit 1; }; done'
      - name: Remove the CI images
        if: always() && steps.need.outputs.build == 'true'
        run: docker rmi -f argus-tools-layer:ci argus-tools-layer-ci-base >/dev/null 2>&1 || true

  # NanoClaw's own vitest suite with the Argus overlay, on a fresh checkout of the
  # pinned commit: `provision.sh check` (clone, install.sh, gateway adapter,
  # engines overlay, pnpm build, vitest) stops before any Docker step, so nothing
  # is built, tagged or saved. The node job's `pnpm test` does not reach these
  # tests: they only run inside a NanoClaw checkout. On PRs, skips when
  # integrations/nanoclaw/ did not change.
  nanoclaw-vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether NanoClaw inputs changed
        id: need
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -E '^(integrations/nanoclaw/|\.gitea/workflows/quality\.yaml$)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping NanoClaw vitest: integrations/nanoclaw/ unchanged"
          fi
      - uses: actions/setup-node@v4
        if: steps.need.outputs.run == 'true'
        with:
          node-version: "22"
      - name: provision.sh check (fresh pinned NanoClaw, engines overlay)
        if: steps.need.outputs.run == 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          set -euo pipefail
          # pnpm through corepack: inside the checkout it is NanoClaw's own pinned
          # packageManager (its pnpm-workspace.yaml has no packages list, which
          # Argus's pnpm 10.0.0 rejects), as on a provisioning host.
          corepack enable
          # Short state path: provision.sh caps the instances root at 56 characters.
          state="/tmp/argus-nc-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          rm -rf "$state"
          ARGUS_NANOCLAW_STATE="$state" ARGUS_NANOCLAW_ENGINES=1 \
            integrations/nanoclaw/provision.sh check
      - name: Remove the checkout
        if: always() && steps.need.outputs.run == 'true'
        run: rm -rf "/tmp/argus-nc-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"

  # Real Docker: Argus starts echo-worker containers that must reach it back via
  # host.docker.internal. Manual until verified on the runner's network layout.
  docker-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | sh; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; }
      - run: uv sync --all-packages --group dev --frozen
      - run: make test-docker

  # Real Kubernetes: a throwaway kind cluster, so the test never touches a shared
  # cluster. Manual until verified on the runner (needs Docker and outbound
  # network). Pods reach the test's Argus through the kind network's gateway.
  kubernetes-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | sh; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; }
      - run: uv sync --all-packages --group dev --frozen
      - name: Install kind (checksum pinned)
        run: |
          curl -sSfL -o /usr/local/bin/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /usr/local/bin/kind" | sha256sum -c -
          chmod +x /usr/local/bin/kind
      - run: kind create cluster --name argus-it --wait 180s
      - name: Run the Kubernetes integration test
        run: |
          gateway="$(docker network inspect kind --format '{{range .IPAM.Config}}{{println .Gateway}}{{end}}' | grep -E '^[0-9.]+$' | head -1)"
          ARGUS_IT_HOST="$gateway" ARGUS_K8S_CONTEXT=kind-argus-it ARGUS_KIND_CLUSTER=argus-it make test-k8s
      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name argus-it

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_docs.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          v=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
      - name: Scan
        env:
          SECRET_SCAN_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: make secret-scan

  audit:
    runs-on: ubuntu-latest
    # Advisories appear without code changes: run on a schedule-like manual trigger and on lockfile PRs.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - run: command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | sh; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; }
      - run: uv sync --all-packages --group dev --frozen
      - run: pnpm install --frozen-lockfile
      - run: make audit

# gitleaks config for the Quality `secret-scan` job (`make secret-scan`).
# Default ruleset. For a reviewed false positive add `# gitleaks:allow` on the line.
title = "argus gitleaks config"

[extend]
useDefault = true

# Redaction tests must contain secret-shaped strings (fake values, never real credentials).
# History is scanned per commit, so a `gitleaks:allow` added later cannot clear earlier commits.
[[allowlists]]
description = "Fake secret fixtures in the live-log redaction tests"
paths = [
  '''packages/core/tests/test_redact\.py''',
  '''apps/api/tests/test_task_log\.py''',
  '''integrations/nanoclaw/engines/livelog\.test\.mjs''',
]

# npm SRI integrity of the pinned graft package: a public hash, not a credential.
[[allowlists]]
description = "Pinned npm integrity hash in the project runtime recipe"
paths = ['''packages/core/src/argus_core/runtime\.py''']
regexes = ['''sha512-[A-Za-z0-9+/=]{80,}''']

[project]
name = "argus-core"
version = "0.1.0"
description = "Shared domain types for Argus (tasks, agents, fleet)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "argus_core"

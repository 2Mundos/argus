[project]
name = "argus-api"
version = "0.1.0"
description = "Argus control-plane API"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "argus-core",
    "docker>=7.1",
    "fastapi>=0.115",
    "jsonschema>=4.26.0",
    "kubernetes>=36.0.3,<37",
    "mcp>=1.20",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "argus_api"

[tool.uv.sources]
argus-core = { workspace = true }

[dependency-groups]
dev = [
    "prometheus-client>=0.26.0",
]

[project]
name = "argus-api"
version = "0.1.0"
description = "Argus control-plane API"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "argus-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "argus_api"

[tool.uv.sources]
argus-core = { workspace = true }

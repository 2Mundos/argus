<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argus is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b1220; color: #e8eef8; font-family: system-ui, sans-serif; text-align: center; padding: 1rem; }
      img { width: 96px; height: 96px; }
      button { margin-top: 1rem; padding: 0.6rem 1.2rem; border-radius: 8px; border: 1px solid #8eb4ff; background: #4f7ff0; color: #f8fbff; font: inherit; }
      p { color: #8b9bb4; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Argus shows live task and agent data, so it needs a network connection. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
